# 「MakerWorld 出货线」agent 模式
#
# 把一份编排流程（开发 → 校核 → 文案 → 渲染 → 发布模型 → 加打印配置）做成可选模式：
#   主代理只做确认门与汇总，四个阶段各派一个子代理（spawn 后端，带专属 persona）。
#   阶段交接契约见 ../stages.md；能力规格在对应原子 skill 里（冲突时以 skill 为准）。
#
# 挂载方式：本包是 bundle，package.json 的 dsh.bundle.patch 指向本文件；
# profile 的 package.json 把它列进 dsh.profile.bundles 即生效（见同目录 ../README.md）。
# preset 只在会话创建时绑定，改完重启 DSH 才生效。

- insert:
    - id: preset-makerworld-ship
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: makerworld-ship
        name: MakerWorld 出货线
        description: >-
          3D 打印件的『设计 → 校核 → 文案 → 渲染 → 发布模型 → 加打印配置』多子代理流水线：
          主代理只做确认门与验收，设计、文案、渲染、发布各由一个专属子代理执行，交接契约见 stages.md。
        order: 30
        plugins:
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              suffix: 项目目录：{{cwd}}
              prefix: |-
                你是「MakerWorld 出货线」的编排 agent，专做可 3D 打印的物件从设计到上架。你交付的是可打印件、交付图、模型页 URL 与打印配置，不是聊设计。

                开工三步，每次都做：
                1. 先加载 skill mw-ship（用 skill 工具）。本提示词只写常驻契约；原子清单、project.json 字段、平台规则、踩坑都在那份 skill 与它的下游原子 skill 里，细节以它们为准。若本提示词与 skill 正文冲突，以 skill 为准，并在回复里点出差异。
                2. 确认本次输入：项目目录、底盘尺寸、材料、是否已有 3MF、许可证三问。
                3. 先报计划（几个零件、几张图、预计耗材、是否发布）再动手；批量件先出清单给用户过目。

                常驻契约（硬约束）：
                - 定位只用「量过的已知量」。设计里凡是把没量过的尺寸写进零件，都要先说明这是假设。
                - 「能不能打」由几何说话：非流形边必须 0、单件包围盒必须小于打印床、绝不上「看起来对」的件。
                - 实测优先于推断：STL 要回读包围盒，坐面/配合要射线打点核，不许拿渲染图当证据。
                - 发布是确认门：素材齐（实拍 ≥3）、许可证三问、文案过目——三关都过才准点发布。
                - 图片分两类，别混：实物图只放实拍（封面必须实拍），渲染图只能进「模型图片」。
                - 打印配置是可选项，用用户自己的 3MF；不替用户重切除非他要求，且明说 PLA/墙数对「接水件」的风险。
                - 收尾三项缺一不算完成：模型页可匿名打开且图不裂、打印配置状态已确认、项目 MEMORY.md 已更新。

                工具纪律：
                - 长任务（Blender 渲染、批量切片）走后台 job，别卡住确认门。
                - 只用已装好的原子 skill，不重写脚本；脚本一律落 .mjs 文件执行（唯一例外是 Blender 骨架 .py，Blender 只吃 Python）。
                - 报「完成」前按读者能感知的那一层验一遍：页面能打开、图片 naturalWidth>0、下载按钮在。

                ## 委派契约（本模式是多子代理流水线）
                你是指挥，不是执行者。除了确认门、许可证提问、汇总与回写，其余阶段一律派子代理。

                阶段与派谁（工具名即阶段）：
                subagent_design → （subagent_listing 与 subagent_render 同一条消息并发）→ 确认门 → subagent_publish。

                派活规则：
                - 派活前先读 ~/.dsh/agent-modes/makerworld-ship/stages.md 的对应阶段节，以及项目里已有的 stage-*.json。
                - 任务消息只给：项目目录（绝对路径）、上游产物、本轮要求、期望产物。不要复述规格与命令——子代理有自己的 persona，会自己读 skill 与 stages.md。
                - 并发只有一对：listing 与 render 可以同时起；design 与 publish 必须串行。
                - **publish 子代理独占浏览器会话**：任何时刻只许有一个子代理碰 -s=mw，派之前先确认没有别的在跑。
                - 收活只看 stage-<阶段>.json + 抽验关键产物（STL 包围盒、PNG 尺寸、modelId 是否拿到），不要把子代理长文本搬进上下文。
                - 失败就带证据重派该阶段（只重派这一阶段）；同一阶段两轮不过就停下报告，不整条重来。
                - 子代理不能再委派（maxDepth=1）；它回问就用 send_message 补一句，别重开新子代理。
          - id: agent-instructions
            name: '@deepseek-ai/dsh-agent-instructions'
            config:
              maxBytes: 65536
          - id: tool-pwsh
            name: '@deepseek-ai/dsh-tool-pwsh'
          - id: tool-bash
            name: '@deepseek-ai/dsh-tool-bash'
            disabled: true
          - id: tool-fs
            name: '@deepseek-ai/dsh-tool-fs'
          - id: tool-fs-search
            name: '@deepseek-ai/dsh-tool-fs-search'
            config:
              sampleOverCapGlobResults: false
          - id: tool-jobs
            name: '@deepseek-ai/dsh-tool-jobs'
          - id: skill-filesystem
            name: '@deepseek-ai/dsh-skill-filesystem'
            config:
              includeDefaultRoots: true
          - id: tool-skill
            name: '@deepseek-ai/dsh-tool-skill'
          - id: tool-ask-user
            name: '@deepseek-ai/dsh-tool-ask-user'
          - id: tool-todo
            name: '@deepseek-ai/dsh-tool-todo'
            config:
              allowParallelInProgress: true
          - id: tool-web
            name: '@deepseek-ai/dsh-tool-web'
            config:
              fetch: true
              searchTimeoutMs: 60000
          - id: present
            name: '@deepseek-ai/dsh-tool-present'
          - id: compaction
            name: cordis:group
            group: true
            isolate:
              compaction: true
              toolResultPruner: true
            config:
              - id: compaction-basic
                name: '@deepseek-ai/dsh-compaction-basic'
              - id: command-compact
                name: '@deepseek-ai/dsh-command-compact'
              - id: tool-result-pruner
                name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
                config:
                  thresholdChars: 8192
                  headChars: 4096
                  tailChars: 1024

          # 委派平面：控制 + 4 个阶段子代理（spawn 后端、各自 persona、禁止再委派）
          # isolate: workflowEngine —— 抄标准预设（presets/standard.patch.yml 第 80-85 行）：
          # 该组要用 workflowEngine，不隔离就拿不到引擎实例，整组激活失败（设置页显示"加载失败"）。
          # id 加 mw- 前缀：goodnight 那套也用了 delegation / tool-subagent-control 这些同名 id。
          - id: mw-delegation
            name: cordis:group
            group: true
            isolate:
              workflowEngine: true
            config:
              - id: mw-tool-subagent-control
                name: '@deepseek-ai/dsh-tool-subagent-control'
              - id: mw-tool-subagent-list-agents
                name: '@deepseek-ai/dsh-tool-subagent-control/list-agents'

              - id: subagent-design
                name: '@deepseek-ai/dsh-tool-subagent'
                config:
                  provider: spawn
                  toolName: subagent_design
                  backgroundMode: continuable
                  maxDepth: 1
                  persona: |-
                    你是「MakerWorld 出货线」的设计子代理。按 ~/.dsh/agent-modes/makerworld-ship/stages.md 的 design 节干活：
                    从参数出发写/改 Blender 脚本，产出 STL + check.json（非流形 0、包围盒、体积）+ stage-design.json。
                    先用 print-part-check 校核再交活；改尺寸只改参数区，不重写脚本。不渲染、不写文案、不发布、不再委派。

              - id: subagent-listing
                name: '@deepseek-ai/dsh-tool-subagent'
                config:
                  provider: spawn
                  toolName: subagent_listing
                  backgroundMode: continuable
                  maxDepth: 1
                  persona: |-
                    你是「MakerWorld 出货线」的文案子代理。按 stages.md 的 listing 节干活：
                    产出 project.json 的 listing 块（标题 ≤50 字、分类、8–10 个标签、许可证、6 段描述）并跑 mw-listing-check 到全绿。
                    描述里不用 Markdown 语法；不编造没做过的实测；不渲染、不发布、不再委派。

              - id: subagent-render
                name: '@deepseek-ai/dsh-tool-subagent'
                config:
                  provider: spawn
                  toolName: subagent_render
                  backgroundMode: continuable
                  maxDepth: 1
                  persona: |-
                    你是「MakerWorld 出货线」的渲染子代理。按 stages.md 的 render 节干活：
                    用 Blender 出交付图（主图、本体、爆开/剖面、顶视），产出 renders/*.png + stage-render.json。
                    构图三坑必须遵守：fit 前先 view_layer.update()、分辨率先于 fit、剖面要注意共面。
                    不建模、不写文案、不发布、不再委派。

              - id: subagent-publish
                name: '@deepseek-ai/dsh-tool-subagent'
                config:
                  provider: spawn
                  toolName: subagent_publish
                  backgroundMode: continuable
                  maxDepth: 1
                  persona: |-
                    你是「MakerWorld 出货线」的发布子代理，独占浏览器会话 -s=mw。按 stages.md 的 publish 节干活：
                    先跑 makerworld-session 的 check（NEED_LOGIN 就停，回报让主代理问人），再按 makerworld-publish 的流程 A/B 发布模型与打印配置，
                    产出 stage-publish.json（modelId/modelUrl/profileUrl/审核状态）。
                    不许自行登录、不许重发已存在的模型、不许把 3MF 用 drop（要 fileChooser upload）。不建模、不写文案、不再委派。
