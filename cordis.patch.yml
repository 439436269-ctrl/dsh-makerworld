# dsh-makerworld bundle patch —— 往 profile 插一行宿主插件行。
#
# 这一行做一件事：给 Loader 一个宿主侧条目（lib/index.js），它在 apply() 里向
# ctx.skills 注册一个 provider，把本包 skills/ 目录下的 skill 作为 rank 600 的
# 内置 skill 提供出去。装完即用：不需要往 ~/.agents/skills 或 ~/.dsh/skills
# 复制任何文件。
#
# 安装：
#   dsh plugin --profile web add dsh-makerworld
#   dsh plugin --profile web add github:439436269-ctrl/dsh-makerworld
# 本地开发（link 到源码目录）：
#   dsh plugin --profile web add "link:D:\codes\.dsh-plugins\src\dsh-makerworld"
# 卸载：
#   dsh plugin --profile web remove dsh-makerworld
#
# ⚠️ 下面 insert 的 `name:` 必须与安装后的包名完全一致，否则 DSH 找不到模块。
#
# 只放出部分 skill（默认全部六个）：
#   在 profile 自己的 cordis.patch.yml 里按 id 覆写本行：
#   - id: dsh-makerworld
#     config:
#       enabledSkills: [mw-ship, print-part-check]
- insert:
    - id: dsh-makerworld
      name: dsh-makerworld
